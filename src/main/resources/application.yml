spring:
  application:
    name: bank
  datasource:
    # Override with DB_URL / DB_USER / DB_PASSWORD environment variables when deploying.
    url: ${DB_URL:jdbc:mysql://localhost:3306/bankdb?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 5m

bank:
  zone: Asia/Kolkata
  atm:
    daily-withdrawal-limit: 25000
    max-pin-attempts: 3
    max-deposit: 200000
  upi:
    per-transaction-limit: 100000
    daily-limit: 100000
    max-pin-attempts: 3
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
