<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/atm :: page(~{::title}, ~{::main})}">
<head><title>Insert card · JavaBank ATM</title></head>
<body>
<main class="screen-content" data-screen="login">
    <h1 class="screen-title">Welcome to JavaBank</h1>
    <p class="screen-sub">Your card <b th:text="${maskedCard}">XXXX</b> is ready. Enter your ATM PIN.</p>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/atm/insert}" method="post" class="screen-form" data-insert-card>
        <label>ATM PIN
            <input type="password" name="pin" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="off" required
                   autofocus placeholder="••••">
        </label>
        <button type="submit" class="screen-btn primary">Insert card &amp; continue ▸</button>
    </form>
    <p class="screen-hint">Shield the keypad while entering your PIN · <a th:href="@{/customer}">Cancel</a></p>
</main>
</body>
</html>
