<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/atm :: page(~{::title}, ~{::main})}">
<head><title>Fast Cash · JavaBank ATM</title></head>
<body>
<main class="screen-content">
    <h1 class="screen-title">Fast Cash</h1>
    <p class="screen-sub">Select an amount</p>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <form data-processing th:action="@{/atm/fast-cash}" method="post" class="menu-grid">
        <button type="submit" name="amount" th:each="a, i : ${amounts}" th:value="${a}"
                th:class="${i.even} ? 'menu-opt left' : 'menu-opt right'"
                th:text="${'₹' + #numbers.formatInteger(a, 1, 'COMMA')}">₹500</button>
    </form>
    <div class="screen-actions"><a class="screen-btn" th:href="@{/atm}">◂ Back</a></div>
</main>
</body>
</html>
