<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/customer :: page(~{::title}, ~{::main})}">
<head><title>Fund · JavaBank</title></head>
<body>
<main class="container cust-main" th:with="active=${o.account.status.name() == 'ACTIVE'}">
    <p><a th:href="@{/customer/invest}">← All funds</a></p>
    <div th:if="${fund}" class="fund-page">
        <section class="panel">
            <div class="fp-head">
                <div>
                    <span class="fc-tag" th:text="${fund.listing.tag}"></span>
                    <h1 th:text="${fund.schemeName}"></h1>
                    <p class="muted" th:text="${fund.fundHouse + ' · ' + fund.category}"></p>
                </div>
                <div class="fp-nav"><span>NAV</span><strong th:text="${'₹' + fund.nav}"></strong>
                    <small th:text="${'as on ' + #temporals.format(fund.navDate, 'dd MMM yyyy')}"></small></div>
            </div>
            <svg class="chart" viewBox="0 0 600 180" preserveAspectRatio="none" role="img" aria-label="NAV over the last year"
                 th:with="pts=${@charts.points(fund.chart, 600, 180)}, area=${@charts.area(fund.chart, 600, 180)}">
                <polygon th:attr="points=${area}" class="spark-area"/><polyline th:attr="points=${pts}" class="spark-line"/>
            </svg>
            <p class="muted small">NAV over the last 12 months</p>
            <div class="fc-returns big">
                <div><span>1 year</span><b th:text="${fund.return1y != null ? fund.return1y + '%' : '—'}" th:classappend="${fund.return1y != null and fund.return1y.signum() < 0} ? 'loss' : 'profit'"></b></div>
                <div><span>3 years (CAGR)</span><b th:text="${fund.return3y != null ? fund.return3y + '%' : '—'}" th:classappend="${fund.return3y != null and fund.return3y.signum() < 0} ? 'loss' : 'profit'"></b></div>
                <div><span>5 years (CAGR)</span><b th:text="${fund.return5y != null ? fund.return5y + '%' : '—'}" th:classappend="${fund.return5y != null and fund.return5y.signum() < 0} ? 'loss' : 'profit'"></b></div>
                <div><span>Risk</span><b th:text="${fund.listing.risk}"></b></div>
            </div>
        </section>

        <form class="panel product-form invest-box" th:action="@{/customer/invest/order}" method="post" data-invest-box>
            <input type="hidden" name="schemeCode" th:value="${fund.listing.schemeCode}">
            <div class="seg two">
                <label><input type="radio" name="type" value="SIP" checked><span><b>Monthly SIP</b><small>from ₹500</small></span></label>
                <label><input type="radio" name="type" value="LUMPSUM"><span><b>One-time</b><small>from ₹1,000</small></span></label>
            </div>
            <label class="field"><span data-amount-label>Monthly amount (₹)</span>
                <input type="number" name="amount" min="500" max="500000" step="100" value="5000" required></label>
            <div class="chips"><button type="button" data-amt="1000">₹1,000</button><button type="button" data-amt="5000">₹5,000</button><button type="button" data-amt="10000">₹10,000</button></div>
            <p class="muted small">Units are bought at the latest NAV when you pay. The SIP is then debited on the same date every month.</p>
            <button type="submit" class="btn dark lg full" th:disabled="${!active}">Continue to checkout →</button>
        </form>
    </div>
</main>
</body>
</html>
