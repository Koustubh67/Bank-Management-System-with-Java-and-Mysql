<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: page(~{::title}, ~{::main})}">
<head><title>Change password · JavaBank Staff</title></head>
<body>
<main class="container narrow">
    <form class="card form login-card" th:action="@{/admin/password}" method="post">
        <h1>Change password</h1>
        <p class="muted" th:if="${me.mustChangePassword}">Welcome, <b th:text="${me.fullName}"></b>! Please replace your
            temporary password before you continue.</p>
        <p class="muted" th:unless="${me.mustChangePassword}" th:text="${me.fullName + ' · ' + me.role.label}"></p>
        <label class="field"><span th:text="${me.mustChangePassword} ? 'Temporary password' : 'Current password'">Current password</span>
            <input type="password" name="currentPassword" required autocomplete="current-password"></label>
        <label class="field"><span>New password</span><input type="password" name="newPassword" required autocomplete="new-password" placeholder="8+ characters, letters and numbers"></label>
        <label class="field"><span>Confirm new password</span><input type="password" name="confirmPassword" required autocomplete="new-password"></label>
        <div class="form-actions"><button type="submit" class="btn primary">Save password</button></div>
    </form>
</main>
</body>
</html>
