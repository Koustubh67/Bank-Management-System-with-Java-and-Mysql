<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/portal :: page(~{::title}, ~{::main})}">
<head><title>Staff login · JavaBank</title></head>
<body>
<main class="container narrow">
    <form class="card form login-card" th:action="@{/admin/login}" method="post">
        <h1>Staff login</h1>
        <div class="alert error" th:if="${param.error}">Invalid username or password</div>
        <div class="alert ok" th:if="${param.logout}">You have been logged out</div>
        <label class="field"><span>Username</span><input type="text" name="username" required autofocus></label>
        <label class="field"><span>Password</span><input type="password" name="password" required></label>
        <div class="form-actions"><button type="submit" class="btn primary">Log in</button></div>
    </form>
</main>
</body>
</html>
