<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/phone :: page(~{::title}, ~{::div.app}, true)}">
<head><title>Pay · JavaPay UPI</title></head>
<body>
<div class="app">
    <header class="app-bar"><a th:href="@{/upi}" class="back">←</a><h2>Pay to UPI ID</h2></header>
    <div class="app-body">
        <div class="toast error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/upi/pay}" method="post" class="uform">
            <label class="ufield"><span>UPI ID of the person you're paying</span>
                <input type="text" name="payeeVpa" th:value="${payeeVpa}" placeholder="name.1234@javabank" autocomplete="off" required autofocus>
            </label>
            <label class="amount-field"><span>₹</span>
                <input type="number" name="amount" th:value="${amount}" min="1" max="100000" step="0.01" placeholder="0" required aria-label="Amount in rupees">
            </label>
            <div class="chips" data-amount-chips>
                <button type="button" data-amt="100">₹100</button><button type="button" data-amt="500">₹500</button>
                <button type="button" data-amt="1000">₹1,000</button><button type="button" data-amt="2000">₹2,000</button>
            </div>
            <label class="ufield"><span>Add a note (optional)</span>
                <input type="text" name="note" th:value="${note}" maxlength="40" placeholder="e.g. Lunch, Rent">
            </label>
            <button type="submit" class="ubtn">Proceed to pay</button>
        </form>
    </div>
</div>
</body>
</html>
