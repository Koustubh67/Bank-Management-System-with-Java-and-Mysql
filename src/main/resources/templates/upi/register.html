<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/phone :: page(~{::title}, ~{::div.app}, false)}">
<head><title>Activate UPI · JavaPay</title></head>
<body>
<div class="app">
    <header class="app-bar"><a th:href="@{/upi/login}" class="back">←</a><h2>Set up UPI</h2></header>
    <div class="app-body">
        <div class="stepper"><span class="on">Verify card</span><span class="on">Set UPI PIN</span><span>Done</span></div>
        <div class="toast error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/upi/register}" method="post" class="uform">
            <div class="mini-card" aria-hidden="true"><span>JavaBank Debit</span><b>•••• •••• •••• ••••</b></div>
            <label class="ufield"><span>Debit card number</span>
                <input type="text" name="cardNumber" inputmode="numeric" maxlength="16" required placeholder="16 digits">
            </label>
            <label class="ufield"><span>ATM PIN</span>
                <input type="password" name="atmPin" inputmode="numeric" maxlength="4" required placeholder="4 digits">
            </label>
            <label class="ufield"><span>New UPI PIN</span>
                <input type="password" name="upiPin" inputmode="numeric" maxlength="6" pattern="\d{6}" required placeholder="6 digits">
            </label>
            <label class="ufield"><span>Confirm UPI PIN</span>
                <input type="password" name="confirmPin" inputmode="numeric" maxlength="6" pattern="\d{6}" required placeholder="6 digits">
            </label>
            <p class="hint">Your account must be approved by the bank. Your UPI ID is created automatically.</p>
            <button type="submit" class="ubtn">Activate UPI</button>
        </form>
    </div>
</div>
</body>
</html>
