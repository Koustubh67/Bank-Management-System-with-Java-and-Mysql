<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/phone :: page(~{::title}, ~{::div.app}, false)}">
<head><title>Login · JavaPay UPI</title></head>
<body>
<div class="app app-auth">
    <div class="auth-hero">
        <div class="app-logo">₹</div>
        <h2>JavaPay</h2>
        <p>by JavaBank</p>
    </div>
    <div class="sheet">
        <div class="toast ok" th:if="${registeredVpa}">
            UPI activated! Your UPI ID is <strong th:text="${registeredVpa}"></strong>
        </div>
        <div class="toast ok" th:if="${param.logout}">You have been logged out</div>
        <div class="toast error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/upi/login}" method="post">
            <label class="ufield"><span>UPI ID</span>
                <input type="text" name="vpa" th:value="${registeredVpa}" placeholder="name.1234@javabank" autocomplete="username" required autofocus>
            </label>
            <div th:replace="~{fragments/upi :: pinpad('ENTER 6-DIGIT UPI PIN')}"></div>
        </form>
        <p class="sheet-foot demo-hint" th:if="${demoEnabled}">Demo: <b>rahul.0001@javabank</b> · UPI PIN <b>123456</b></p>
        <p class="sheet-foot">New here or forgot your UPI PIN?<br><a th:href="@{/upi/register}">Activate / reset with debit card</a></p>
    </div>
</div>
</body>
</html>
